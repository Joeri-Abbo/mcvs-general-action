---
name: mcvs-general-action
description: |
  The Mission Critical Vulnerability Scanner (MCVS) General action.
inputs:
  testing-type:
    description: |
      The testing type, e.g. integration, unit or some other.
  zizmor-action-advanced-security:
    default: "true"
    description: Upload results to Advanced Security or not.
runs:
  using: composite
  steps:
    - if: |
        github.event_name == 'pull_request' &&
        (inputs.testing-type == 'lint-commit' ||
          inputs.testing-type == 'lint-git')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-action'
      name: run zizmor 🌈
      # yamllint disable-line rule:line-length
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        advanced-security: ${{ inputs.zizmor-action-advanced-security }}
        min-severity: low
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-commit'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        CONFIGS_PATH="${GITHUB_ACTION_PATH}/configs"

        npm ci --ignore-scripts --prefix "${CONFIGS_PATH}"

        "${CONFIGS_PATH}/node_modules/.bin/commitlint" \
          --config "${CONFIGS_PATH}/commitlint.config.mjs" \
          --from "${BASE_SHA}" \
          --to "${HEAD_SHA}" \
          --verbose
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      name: check out the base branch 🌳
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: .mcvs-base
        persist-credentials: false
        ref: ${{ github.event.pull_request.base.ref }}
        repository: ${{ github.event.pull_request.base.repo.full_name }}
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      run: |
        # origin points at the head repository, which the pull request
        # author controls, so compare against the base branch as cloned
        # from the base repository itself.
        git fetch --no-tags "${GITHUB_WORKSPACE}/.mcvs-base" \
          "+HEAD:refs/mcvs/base"
        rm -rf "${GITHUB_WORKSPACE}/.mcvs-base"
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        commits_behind=$(git rev-list --count HEAD..refs/mcvs/base)
        if (( commits_behind > 0 )); then
          echo "❗ Branch is behind ${BASE_REF} by $commits_behind commits"
          exit 1
        fi
        echo "✅ Branch is up to date with ${BASE_REF}"
      shell: bash
    # yamllint disable rule:line-length
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        BASE="refs/mcvs/base"

        current_branch=$(git rev-parse --abbrev-ref HEAD)

        commits=$(git rev-list "${BASE}..HEAD" --merges)

        for sha in $commits; do
          p1=$(git rev-parse "$sha^1")
          p2=$(git rev-parse "$sha^2")

          if git merge-base --is-ancestor "${p1}" "${BASE}" && ! git merge-base --is-ancestor "${p2}" "${BASE}"; then
            merged_from="${p1}"
          elif git merge-base --is-ancestor "${p2}" "${BASE}" && ! git merge-base --is-ancestor "${p1}" "${BASE}"; then
            merged_from="${p2}"
          else
            continue
          fi

          echo "❗ Detected a merge of ${BASE_REF} into ${current_branch} at commit ${sha}"
          echo "  Commit message: $(git log --format=%s -n 1 $sha)"
          exit 1
        done

        echo "✅ No merges of ${BASE_REF} detected in ${current_branch}"
        exit 0
      shell: bash
    - if: |
        github.event_name == 'pull_request' &&
        inputs.testing-type == 'lint-git'
      run: |
        fixup_commits=$(git log --oneline --grep="^fixup!" --grep="^squash!" refs/mcvs/base..HEAD)
        if [ -n "$fixup_commits" ]; then
          echo "❗ Found fixup or squash commits that should be squashed:"
          echo "$fixup_commits"
          exit 1
        fi
        echo "✅ No fixup or squash commits found"
      shell: bash
    - if: inputs.testing-type == 'lint-links'
      name: check links 🔗
      # yamllint disable-line rule:line-length
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        # Restates the upstream default args to append --include-fragments,
        # which validates #anchor targets. Re-sync on a lychee-action bump.
        args: >-
          --verbose --no-progress --include-fragments
          './**/*.md' './**/*.html' './**/*.rst'
    - if: inputs.testing-type == 'markdownlint'
      # yamllint disable-line rule:line-length
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        config: ${{ github.action_path }}/configs/mcvs.markdownlint.yaml
        globs: |
          **/*.md
          !**/node_modules/**
    - if: inputs.testing-type == 'yamllint'
      run: |
        python3 -m pip install --require-hashes --user \
          -r "${GITHUB_ACTION_PATH}/configs/requirements.txt"
        yamllint -c "${GITHUB_ACTION_PATH}/configs/yamllint.yaml" .
      shell: bash
